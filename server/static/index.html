<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围棋 GoGame</title>
<style>
:root { color-scheme: light; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #D2B48C;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
}
#app { display: flex; gap: 20px; padding: 20px; background: #DEB887; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
canvas { display: block; cursor: pointer; border-radius: 4px; }
#panel { width: 200px; background: #F0EAD6; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
#panel h2 { font-size: 17px; text-align: center; color: #333; }
#panel label { font-size: 11px; color: #666; margin-bottom: -6px; font-weight: bold; }
#panel input, #panel select { padding: 5px 7px; border: 1px solid #CCC; border-radius: 4px; font-size: 12px; font-family: inherit; }
#panel button { padding: 7px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; background: #8B7355; color: white; }
#panel button:hover { background: #6B5335; }
#panel button:disabled { background: #CCC; cursor: not-allowed; }
#panel button.warn { background: #B85450; }
#panel button.ok { background: #4A8B3F; }
#conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
#status { font-size: 12px; color: #444; text-align: center; min-height: 16px; }
#error-msg { font-size: 11px; color: #B85450; text-align: center; min-height: 14px; }
#info { font-size: 11px; color: #666; line-height: 1.5; }
#info b { color: #333; }
#room-section { background: #E8DCC8; border-radius: 6px; padding: 10px; }
#game-btns, #scoring-btns { display: flex; gap: 5px; }
#game-btns button, #scoring-btns button { flex: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="board-wrap"><canvas id="board"></canvas></div>
  <div id="panel">
    <h2>围棋 GoGame</h2>

    <div id="room-section">
      <label>房间号</label>
      <input id="room-id" placeholder="加入时输入房间号">
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button id="btn-create" style="flex:1;">创建房间</button>
        <button id="btn-join" style="flex:1;">加入房间</button>
      </div>
      <label for="board-select" style="margin-top:4px;">棋盘</label>
      <select id="board-select"><option value="">标准19路</option></select>
      <label for="player-name">昵称</label>
      <input id="player-name" value="" placeholder="匿名" maxlength="12">
    </div>

    <div id="status"><span id="conn-dot"></span>创建或加入房间</div>
    <div id="error-msg"></div>

    <div id="game-btns" class="hidden">
      <button id="btn-pass">虚手</button>
      <button id="btn-end">终局</button>
      <button id="btn-resign" class="warn">认输</button>
    </div>

    <div id="scoring-btns" class="hidden">
      <button id="btn-confirm" class="ok">确认终局</button>
      <button id="btn-cancel-scoring">返回对局</button>
    </div>
    <div id="info"></div>
  </div>
</div>

<script>
const STONE_R = 14, CELL = 36, MARGIN = 44, BOARD_SIZE = 19;
const COLOR_EMPTY = 0, COLOR_BLACK = 1, COLOR_WHITE = 2, MARK_NEUTRAL = 3;
const CANVAS_PX = MARGIN * 2 + CELL * (BOARD_SIZE - 1);

let state = null, roomId = null, token = null, myColor = null;
let disabledSet = new Set(), hoverPos = null;
let pollTimer = null, pollInterval = 500, pollFailures = 0;
let lastActionTime = 0, connOk = false;

const canvas = document.getElementById("board");
canvas.width = CANVAS_PX; canvas.height = CANVAS_PX;
canvas.style.width = CANVAS_PX + "px"; canvas.style.height = CANVAS_PX + "px";
const ctx = canvas.getContext("2d");

// ═══ Drawing ═══
function toPx(r, c) { return [MARGIN + c * CELL, MARGIN + r * CELL]; }
function toGrid(px, py) {
  const c = Math.round((px - MARGIN) / CELL), r = Math.round((py - MARGIN) / CELL);
  if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return null;
  if (disabledSet.has(r * 100 + c)) return null;
  return [r, c];
}

function drawLineSegments(x1, y1, x2, y2, isRow, idx) {
  let dl = []; for (const k of disabledSet) { const r = Math.floor(k / 100), c = k % 100; if (isRow && r === idx) dl.push(c); if (!isRow && c === idx) dl.push(r); }
  dl.sort((a, b) => a - b);
  if (!dl.length) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); return; }
  let s = isRow ? x1 : y1, e = isRow ? x2 : y2;
  for (const p of dl) {
    const cp = MARGIN + p * CELL, gs = cp - CELL / 2, ge = cp + CELL / 2;
    if (s < gs) { ctx.beginPath(); isRow ? (ctx.moveTo(s, y1), ctx.lineTo(gs, y2)) : (ctx.moveTo(x1, s), ctx.lineTo(x2, gs)); ctx.stroke(); }
    s = ge;
  }
  if (s < e) { ctx.beginPath(); isRow ? (ctx.moveTo(s, y1), ctx.lineTo(e, y2)) : (ctx.moveTo(x1, s), ctx.lineTo(x2, e)); ctx.stroke(); }
}

function drawBoard() {
  ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX);
  ctx.fillStyle = "#DEB887"; ctx.fillRect(0, 0, CANVAS_PX, CANVAS_PX);
  ctx.strokeStyle = "#4A3728"; ctx.lineWidth = 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    drawLineSegments(MARGIN, MARGIN + i * CELL, MARGIN + CELL * (BOARD_SIZE - 1), MARGIN + i * CELL, true, i);
    drawLineSegments(MARGIN + i * CELL, MARGIN, MARGIN + i * CELL, MARGIN + CELL * (BOARD_SIZE - 1), false, i);
  }
  const side = CELL / 2;
  for (const k of disabledSet) {
    const r = Math.floor(k / 100), c = k % 100, [x, y] = toPx(r, c);
    ctx.fillStyle = "#DEB887"; ctx.fillRect(x - side - 1, y - side - 1, side * 2 + 2, side * 2 + 2);
    ctx.fillStyle = "#8B7355"; ctx.fillRect(x - side + 2, y - side + 2, side * 2 - 4, side * 2 - 4);
  }
  if (BOARD_SIZE === 19 && disabledSet.size < 50) {
    const stars = [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]]; ctx.fillStyle = "#4A3728";
    for (const [r, c] of stars) { if (disabledSet.has(r * 100 + c)) continue; const [x, y] = toPx(r, c); ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.font = "9px Arial"; ctx.fillStyle = "#4A3728"; ctx.textAlign = "center";
  const labels = "ABCDEFGHJKLMNOPQRST";
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = MARGIN + i * CELL, y = MARGIN + i * CELL;
    ctx.fillText(labels[i], x, 14); ctx.fillText(labels[i], x, CANVAS_PX - 10);
    ctx.fillText(String(BOARD_SIZE - i), 14, y + 3); ctx.fillText(String(BOARD_SIZE - i), CANVAS_PX - 10, y + 3);
  }
}

function drawStone(r, c, color, ghost) {
  const [x, y] = toPx(r, c), r2 = STONE_R - 1;
  let g = ctx.createRadialGradient(x - 4, y - 4, 1, x, y, r2);
  if (color === COLOR_BLACK) { g.addColorStop(0, ghost ? "#999" : "#555"); g.addColorStop(1, ghost ? "#777" : "#111"); }
  else { g.addColorStop(0, ghost ? "#EEE" : "#F5F5F5"); g.addColorStop(1, ghost ? "#CCC" : "#D0D0D0"); }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color === COLOR_BLACK ? "#333" : "#BBB"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255," + (ghost ? "0.15" : "0.3") + ")"; ctx.beginPath(); ctx.arc(x - 4, y - 4, r2 * 0.35, 0, Math.PI * 2); ctx.fill();
}

function drawMark(r, c, owner) {
  const [x, y] = toPx(r, c), s = STONE_R * 0.7, h = s / 2;
  if (owner === COLOR_BLACK) { ctx.fillStyle = "#111"; ctx.fillRect(x - h, y - h, s, s); ctx.strokeStyle = "#444"; ctx.lineWidth = 1; ctx.strokeRect(x - h, y - h, s, s); }
  else if (owner === COLOR_WHITE) { ctx.fillStyle = "#F0F0F0"; ctx.fillRect(x - h, y - h, s, s); ctx.strokeStyle = "#BBB"; ctx.lineWidth = 1; ctx.strokeRect(x - h, y - h, s, s); }
  else { ctx.fillStyle = "#111"; ctx.beginPath(); ctx.moveTo(x - h, y - h); ctx.lineTo(x + h, y - h); ctx.lineTo(x + h, y + h); ctx.fill(); ctx.fillStyle = "#F0F0F0"; ctx.beginPath(); ctx.moveTo(x - h, y - h); ctx.lineTo(x - h, y + h); ctx.lineTo(x + h, y + h); ctx.fill(); ctx.strokeStyle = "#666"; ctx.lineWidth = 1; ctx.strokeRect(x - h, y - h, s, s); }
}

function render() {
  drawBoard(); if (!state) return;
  const bd = state.board;
  for (let r = 0; r < BOARD_SIZE; r++) for (let c = 0; c < BOARD_SIZE; c++) if (bd[r][c] !== COLOR_EMPTY) drawStone(r, c, bd[r][c], false);
  if (state.mode === "scoring" && state.marks)
    for (const [k, v] of Object.entries(state.marks)) { const [r, c] = k.split(",").map(Number); drawMark(r, c, v); }
  if (hoverPos && state && state.mode === "playing" && !state.game_over && state.your_color === state.current)
    { const [hr, hc] = hoverPos; if (bd[hr][hc] === COLOR_EMPTY) drawStone(hr, hc, state.current, true); }
}

// ═══ Connection ═══
function setConn(ok) {
  connOk = ok;
  const dot = document.getElementById("conn-dot");
  dot.style.background = ok ? "#4A8B3F" : pollFailures ? "#B85450" : "#CCAA00";
}

function showError(msg) {
  const el = document.getElementById("error-msg"); el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 4000);
}

// ═══ API ═══
async function api(path, body) {
  const opts = { method: body ? "POST" : "GET", headers: {} };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const ctrl = new AbortController(); opts.signal = ctrl.signal;
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(path, opts);
    clearTimeout(t);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "请求失败");
    return data;
  } catch (e) {
    clearTimeout(t);
    throw e;
  }
}

async function createRoom() {
  const name = (document.getElementById("player-name").value || "").trim() || "黑方";
  const bf = document.getElementById("board-select").value;
  const data = await api("/api/create", { name, board: bf });
  roomId = data.room_id; token = data.token; myColor = data.color; state = data.state;
  applyState(); document.getElementById("room-id").value = roomId;
  document.getElementById("game-btns").classList.remove("hidden"); updateUI();
  startPoll();
}

async function joinRoom() {
  const rid = document.getElementById("room-id").value.trim(); if (!rid) return showError("请输入房间号");
  const name = (document.getElementById("player-name").value || "").trim() || "白方";
  const data = await api("/api/join/" + rid, { name });
  roomId = data.room_id; token = data.token; myColor = data.color; state = data.state;
  applyState(); document.getElementById("game-btns").classList.remove("hidden"); updateUI();
  startPoll();
}

// ═══ Polling (exponential backoff) ═══
function startPoll() {
  if (pollTimer) clearTimeout(pollTimer);
  pollInterval = 500; pollFailures = 0;
  pollTimer = setTimeout(doPoll, pollInterval);
}

function doPoll() {
  if (!roomId || !token) return;
  api("/api/state/" + roomId + "?token=" + token)
    .then(data => {
      pollFailures = 0; pollInterval = 500; setConn(true);
      const prevMoves = state ? state.move_count : -1;
      const prevMode = state ? state.mode : "";
      const prevMarks = state ? JSON.stringify(state.marks) : "";
      const newMarks = JSON.stringify(data.marks);
      if (data.move_count !== prevMoves || data.mode !== prevMode || newMarks !== prevMarks) {
        state = data; render(); updateUI();
      } else {
        // 即便没变化也更新 players_online
        state = data;
      }
    })
    .catch(e => {
      pollFailures++;
      setConn(false);
      pollInterval = Math.min(pollInterval * 2, 8000);
      if (pollFailures > 3) showError("连接中断，正在重试…");
    })
    .finally(() => {
      if (roomId) pollTimer = setTimeout(doPoll, pollInterval);
    });
}

// ═══ Actions (debounced) ═══
async function doAction(action, r, c) {
  if (!roomId || !token) return;
  const now = Date.now();
  if (now - lastActionTime < 250) return; // 防抖 250ms
  lastActionTime = now;
  try {
    const body = { token, action }; if (r !== undefined) { body.r = r; body.c = c; }
    const data = await api("/api/action/" + roomId, body);
    state = data; render(); updateUI();
  } catch (e) { showError(e.message); }
}

// ═══ State sync ═══
function applyState() {
  disabledSet = new Set((state.disabled || []).map(([r, c]) => r * 100 + c));
  render();
}

function updateUI() {
  if (!state) return;
  const st = document.getElementById("status"), info = document.getElementById("info");
  const cn = myColor === COLOR_BLACK ? "⚫ 黑方" : myColor === COLOR_WHITE ? "⚪ 白方" : "观战";

  // 在线状态小点
  let po = state.players_online || {};
  let dotHint = "";
  if (myColor === COLOR_BLACK) dotHint = po.white ? "" : " (等待白方…)";
  else if (myColor === COLOR_WHITE) dotHint = po.black ? "" : " (等待黑方…)";

  if (state.mode === "scoring") {
    st.innerHTML = '<span id="conn-dot" style="background:#CCAA00;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>标记阶段 — 点击棋盘标记';
    document.getElementById("game-btns").classList.add("hidden");
    document.getElementById("scoring-btns").classList.remove("hidden");
    canvas.style.cursor = "pointer";

    if (state.score_final) {
      document.getElementById("btn-confirm").disabled = true;
      document.getElementById("btn-confirm").textContent = "已确认 ✓";
      document.getElementById("btn-cancel-scoring").disabled = true;
      st.innerHTML = '<span id="conn-dot" style="background:#4A8B3F;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>计分已确认';
    }

    let si = `棋盘: <b>${state.board_name}</b><br>手数: <b>${state.move_count}</b><br>`;
    if (state.score) {
      const sc = state.score;
      si += `⚫ <b>${sc.black_raw.toFixed(1)}</b> | ⚪ <b>${sc.white_raw.toFixed(1)}</b><br>`;
      si += `贴子 ⚪ +3.25 → <b>${sc.white_komi.toFixed(1)}</b><br>`;
      const ad = Math.abs(sc.diff);
      si += `差 <b>${ad.toFixed(1)}</b> ${sc.diff > 0 ? '⚫胜' : sc.diff < 0 ? '⚪胜' : '平局'}`;
    }
    info.innerHTML = si;
    return;
  }

  document.getElementById("game-btns").classList.remove("hidden");
  document.getElementById("scoring-btns").classList.add("hidden");

  if (state.game_over && state.winner) {
    st.innerHTML = '<span id="conn-dot" style="background:#4A8B3F;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>' +
      ((state.winner === COLOR_BLACK ? "⚫ 黑方" : "⚪ 白方") + "认输胜");
  } else if (state.game_over) {
    st.innerHTML = '<span id="conn-dot" style="background:#CCAA00;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>对局结束';
  } else if (myColor && state.current !== myColor) {
    st.innerHTML = `<span id="conn-dot" style="background:#${connOk ? '4A8B3F' : 'B85450'};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>${cn} — 等待对手${dotHint}`;
  } else if (myColor) {
    st.innerHTML = `<span id="conn-dot" style="background:#${connOk ? '4A8B3F' : 'B85450'};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>${cn} — 轮到你`;
  } else {
    st.innerHTML = '<span id="conn-dot" style="background:#888;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;"></span>观战中';
  }

  info.innerHTML = `棋盘: <b>${state.board_name}</b><br>手数: <b>${state.move_count}</b><br>提子 ⚫ <b>${state.captured_black}</b> ⚪ <b>${state.captured_white}</b><br>${state.players.black ? '⚫ <b>' + state.players.black + '</b>' : '⚫ 等待中'}<br>${state.players.white ? '⚪ <b>' + state.players.white + '</b>' : '⚪ 等待中'}`;

  const isPlaying = state.mode === "playing";
  const isMyTurn = myColor && state.current === myColor;
  const hasEnded = state.game_over;
  document.getElementById("btn-pass").disabled = !isPlaying || hasEnded || !isMyTurn;
  document.getElementById("btn-end").disabled = !isPlaying || hasEnded;
  document.getElementById("btn-resign").disabled = !isPlaying || hasEnded;
  canvas.style.cursor = (isPlaying && isMyTurn) ? "pointer" : "default";
}

// ═══ Events ═══
canvas.addEventListener("click", e => {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (CANVAS_PX / rect.width);
  const py = (e.clientY - rect.top) * (CANVAS_PX / rect.height);
  const pos = toGrid(px, py);
  if (!pos) return;
  if (!state || !myColor) return;
  if (state.mode === "scoring") { doAction("mark", pos[0], pos[1]); }
  else if (!state.game_over && state.current === myColor) { doAction("move", pos[0], pos[1]); }
});

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (CANVAS_PX / rect.width);
  const py = (e.clientY - rect.top) * (CANVAS_PX / rect.height);
  const np = toGrid(px, py);
  if (JSON.stringify(np) !== JSON.stringify(hoverPos)) { hoverPos = np; render(); }
});
canvas.addEventListener("mouseleave", () => { hoverPos = null; render(); });

document.getElementById("btn-create").addEventListener("click", async () => {
  try { await createRoom(); } catch (e) { showError(e.message); }
});
document.getElementById("btn-join").addEventListener("click", async () => {
  try { await joinRoom(); } catch (e) { showError(e.message); }
});
document.getElementById("btn-pass").addEventListener("click", () => doAction("pass"));
document.getElementById("btn-end").addEventListener("click", () => {
  if (confirm("确定终局？双方将进入标记计分阶段。")) doAction("end_game");
});
document.getElementById("btn-resign").addEventListener("click", () => {
  if (confirm("确定认输吗？")) doAction("resign");
});
document.getElementById("btn-confirm").addEventListener("click", () => {
  if (confirm("确认当前结果为最终结果吗？")) doAction("confirm");
});
document.getElementById("btn-cancel-scoring").addEventListener("click", () => doAction("cancel_scoring"));

async function loadBoards() {
  try {
    const data = await api("/api/boards"), sel = document.getElementById("board-select");
    for (const b of data.boards) { const o = document.createElement("option"); o.value = b.file; o.textContent = `${b.name} (${b.disabled ? '-' + b.disabled : '标准'})`; sel.appendChild(o); }
  } catch (e) {}
}
loadBoards();
</script>
</body>
</html>
