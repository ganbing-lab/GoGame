<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围棋 GoGame · 网页版</title>
<style>
:root {
  --bg: #201d18;
  --panel: #2c2721;
  --panel-2: #38322a;
  --line: #4a443c;
  --text: #e8e0d2;
  --text-dim: #a89f8f;
  --gold: #d4a24e;
  --ok: #4a8b3f;
  --warn: #b85450;
  --board-bg: #DEB887;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  background: radial-gradient(1200px 800px at 70% -10%, #3a342a 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
header { text-align: center; padding: 18px 16px 6px; }
header h1 {
  font-size: 26px; letter-spacing: 4px;
  background: linear-gradient(90deg, #e8c894, var(--gold), #e8c894);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
header .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; }

main {
  display: flex; gap: 18px; align-items: flex-start;
  padding: 14px 16px 20px; max-width: 1200px; width: 100%;
  justify-content: center; flex-wrap: wrap;
}
#board-wrap {
  background: linear-gradient(160deg, #4a3f2e, #2e2618);
  padding: 14px; border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
  display: block; border-radius: 6px; cursor: pointer;
  max-width: 100%; height: auto; touch-action: manipulation;
}
#board-name { font-size: 12px; color: #cdbf9e; letter-spacing: 1px; }

#panel { display: flex; flex-direction: column; gap: 12px; width: 300px; }
.card {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}
.card h2 {
  font-size: 13px; color: var(--gold); letter-spacing: 2px;
  margin-bottom: 8px; font-weight: 600;
}
label.fld { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
select, input[type="text"], input[type="number"], #room-input {
  width: 100%; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: #221e18; color: var(--text);
  font-size: 13px; font-family: inherit; outline: none;
}
select:focus, input:focus { border-color: var(--gold); }

/* 服务器地址栏（图标 + 输入框 + 检测按钮一体） */
.url-bar {
  display: flex; align-items: center; gap: 6px;
  background: #1b1712; border: 1px solid var(--line); border-radius: 10px;
  padding: 4px 5px 4px 10px; margin-bottom: 8px;
  transition: border-color .15s, box-shadow .15s;
}
.url-bar:focus-within {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 162, 78, 0.16);
}
.url-bar svg { flex: 0 0 auto; color: var(--text-dim); }
.url-bar input {
  flex: 1; min-width: 0; background: transparent; border: none;
  padding: 6px 0; color: var(--text); font-size: 13px; font-family: inherit; outline: none;
}
.url-bar input::placeholder { color: rgba(168, 159, 143, 0.45); }
.url-bar button {
  flex: 0 0 auto; padding: 6px 13px; border-radius: 7px;
  background: #6b5a3a; border: 1px solid #8a7447; color: #fff; font-size: 12px;
}
.url-bar button:hover:not(:disabled) { filter: brightness(1.15); }
button {
  padding: 8px 10px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-family: inherit; color: #fff;
  background: var(--panel-2); border: 1px solid var(--line);
  transition: filter .12s, transform .05s;
}
button:hover:not(:disabled) { filter: brightness(1.15); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .38; cursor: not-allowed; }
button.primary { background: #6b5a3a; border-color: #8a7447; }
button.ok { background: var(--ok); border-color: #5c9c52; }
button.warn { background: #8a6a2f; border-color: #a8843a; }
button.danger { background: var(--warn); border-color: #c96a64; }
button.ghost { background: transparent; border: 1px dashed var(--line); color: var(--text-dim); }
.btn-row { display: flex; gap: 6px; margin-top: 6px; }
.btn-row button { flex: 1; }

#status-card .turn { font-size: 16px; font-weight: 600; color: var(--text); }
#status-card .turn .you { color: var(--gold); }
.meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.hint { font-size: 12px; color: var(--gold); min-height: 18px; margin-top: 4px; }

.net-actions { display: flex; gap: 6px; }
.net-actions button { flex: 1; }
#join-box { display: flex; gap: 6px; margin-top: 8px; }
#join-box input { flex: 1; }
#join-box button { flex: 0 0 auto; }
.room-info {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  background: #241f17; border: 1px solid #5a4b2e; font-size: 13px;
}
.room-info b { color: var(--gold); font-size: 15px; letter-spacing: 2px; }
#net-status { font-size: 12px; color: var(--text-dim); margin-top: 8px; min-height: 16px; }

.hidden { display: none !important; }
#scores { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.score-line {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; padding: 6px 8px; border-radius: 8px; background: #241f17;
}
.score-rule { color: var(--gold); font-size: 12px; }
.score-result { color: var(--text); font-weight: 600; }
.score-detail { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
.tip { font-size: 11px; color: var(--text-dim); line-height: 1.7; margin-top: 6px; }

footer { padding: 6px 16px 18px; font-size: 12px; color: var(--text-dim); text-align: center; }
#version-tag {
  position: fixed; left: 12px; bottom: 8px; z-index: 10;
  font-size: 11px; color: rgba(232,224,210,0.4); user-select: none;
}
#repo-link {
  position: fixed; top: 12px; left: 12px; z-index: 20;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(44,39,33,0.85); border: 1px solid var(--line);
  color: var(--text-dim); font-size: 12px; text-decoration: none;
  backdrop-filter: blur(4px);
  transition: color .15s, border-color .15s;
}
#repo-link:hover { color: var(--gold); border-color: var(--gold); }
#repo-link svg { flex: 0 0 auto; }

@media (max-width: 880px) {
  main { flex-direction: column; align-items: center; }
  #panel { width: 100%; max-width: 560px; }
}
@media (max-width: 640px) {
  header { padding-top: 12px; }
  header h1 { font-size: 22px; letter-spacing: 3px; }
  header .sub { font-size: 11px; }
  #board-wrap { padding: 8px; }
  main { padding: 8px 8px 14px; gap: 12px; }
  .card { padding: 10px 12px; }
  button { padding: 10px 8px; font-size: 14px; }  /* 触屏友好 */
  .url-bar input { font-size: 14px; }
  .url-bar button { padding: 8px 14px; font-size: 13px; }
  #repo-link { top: 8px; left: 8px; padding: 4px 9px; font-size: 11px; }
  #version-tag { font-size: 10px; }
}
</style>
</head>
<body>
<a id="repo-link" href="https://github.com/ganbing-lab/GoGame" target="_blank" rel="noopener" title="查看 GitHub 仓库">
  <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  <span>仓库</span>
</a>
<header>
  <h1>围 棋</h1>
  <div class="sub">GoGame 网页版 · 双人对弈 / 联机对战 · 支持异形棋盘</div>
</header>

<main>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="board-name">棋盘</div>
  </div>

  <aside id="panel">
    <section class="card">
      <h2>棋盘</h2>
      <label class="fld" for="board-select">选择棋盘（联机时由房主锁定）</label>
      <select id="board-select"></select>
      <div class="btn-row">
        <button id="btn-import" class="ghost">导入棋盘 JSON…</button>
      </div>
      <input type="file" id="board-file" accept=".json,.txt" hidden>
    </section>

    <section class="card" id="status-card">
      <div id="turn" class="turn">⚫ 黑方 落子</div>
      <div class="meta">
        <span id="move-num">第 0 手</span>
        <span id="captures">提子 ⚫0 ⚪0</span>
      </div>
      <div id="hint" class="hint"></div>
    </section>

    <section class="card">
      <h2>对局</h2>
      <div class="btn-row">
        <button id="btn-pass">虚手</button>
        <button id="btn-end" class="warn">终局</button>
        <button id="btn-resign" class="danger">认输</button>
      </div>
      <div class="btn-row">
        <button id="btn-undo">悔棋</button>
        <button id="btn-prev">◀ 后退</button>
        <button id="btn-next">前进 ▶</button>
      </div>
      <div class="btn-row">
        <button id="btn-new" class="primary">新对局</button>
      </div>
    </section>

    <section class="card hidden" id="scoring-card">
      <h2>终局计分</h2>
      <div class="btn-row">
        <button id="btn-autodead" class="ghost">自动检测死子</button>
      </div>
      <p class="tip">点击棋子：标记 / 取消死子（红 ×）<br>
         点击空点：轮换归属 自动 → 黑 → 白 → 自动</p>
      <div id="scores"></div>
      <div class="btn-row">
        <button id="btn-confirm" class="ok">确认终局</button>
        <button id="btn-resume" class="ghost">返回对局</button>
      </div>
    </section>

    <section class="card">
      <h2>联机对战（服务器）</h2>
      <label class="fld" for="server-url">服务器地址（留空 = 与页面同源）</label>
      <div class="url-bar">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <input id="server-url" placeholder="如 http://192.168.1.5:8080 或穿透域名" spellcheck="false" autocomplete="off">
        <button id="btn-net-check">检测</button>
      </div>
      <div class="net-actions">
        <button id="btn-create-room" class="primary">创建房间</button>
        <button id="btn-join-room" class="ghost">加入房间</button>
      </div>
      <div id="join-box" class="hidden">
        <input id="room-input" placeholder="输入 6 位房间号" maxlength="6">
        <button id="btn-do-join" class="primary">加入</button>
      </div>
      <div id="room-info" class="hidden"></div>
      <div id="net-status"></div>
      <div class="btn-row">
        <button id="btn-leave-net" class="danger hidden">退出联机</button>
      </div>
      <p class="tip">房主创建房间生成 6 位房间号，对方输入即可加入；服务器只做状态中转，对局数据实时全量同步。</p>
    </section>
  </aside>
</main>

<footer>点击空位落子 · 虚手两次或点击「终局」进入计分 · 支持将异形棋盘 JSON 导入使用</footer>
<div id="version-tag"></div>
<script src="boards.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
